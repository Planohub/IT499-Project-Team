<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFoodLink+ — Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="loginBox">
        <div class="loginHeader">
            <h1>CampusFoodLink+</h1>
            <p class="login-subtitle">Smart Campus Dining Platform</p>
        </div>

        <div class="loginCredentials">
            <h2>Login</h2>

            <!-- This will change based on the login credentials (vendor selction, vendor dashboard or admin dashbaord)  -->
            <form action="vendors.html">
                <div class="credentialForm">
                    <label for="username">Username</label>
                    <input type="text" id="username">
                </div>

                <div class="credentialForm">
                    <label for="password">Password</label>
                    <input type="password" id="password">
                </div>

                <button type="submit" class="btn-login">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
