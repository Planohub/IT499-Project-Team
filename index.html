<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFoodLink+ — Login</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="loginBox">
        <div class="loginHeader">
            <!-- Logo goes here eventually -->
            <h1>CampusFoodLink+</h1>
            <p class="loginSubtitle">Smart Campus Dining Platform</p>
        </div>

        <div class="loginCredentials">
            <h2>Login</h2>

            <!-- Prototype login routes to student ordering workflow -->
            <form action="vendors.html">
                <div class="credentialForm">
                    <label for="username">Username</label>
                    <input type="text" id="username">
                </div>

                <div class="credentialForm">
                    <label for="password">Password</label>
                    <input type="password" id="password">
                </div>

                <button type="submit" class="defaultButton">Sign In</button>
            </form>
        </div>
    </div>
</body>  <!-- test mode -->

</html>
