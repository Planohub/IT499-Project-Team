<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFoodLink+ — Login</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="loginBox">
        <div class="loginHeader">
            <h1>CampusFoodLink+</h1>
            <p class="loginSubtitle">Smart Campus Dining Platform</p>
        </div>

        <div class="loginCredentials">
            <h2>Simulated Login</h2>

            <form id="loginForm">
                <div class="credentialForm">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="e.g., student, vendor, or admin" value="student">
                </div>

                <div class="credentialForm">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" value="••••••••">
                </div>

                <button type="submit" class="defaultButton">Sign In</button>
            </form>

            <hr style="border: none; border-top: 1px solid var(--lightGrey); margin: 20px 0;">

            <div style="text-align: center; margin-bottom: 15px;">
                <p style="font-size: 0.85rem; color: var(--grey); font-weight: 600; margin-bottom: 6px;">Sign In as Vendor Portal:</p>
                <div style="display: flex; gap: 8px;">
                    <select id="vendorSelectDropdown" style="flex: 1; padding: 8px; border: 1px solid var(--lightGrey); border-radius: 4px;">
                        </select>
                    <button id="vendorLoginBtn" class="secondaryButton" style="width: auto; padding: 8px 15px;">Login</button>
                </div>
            </div>

            <div style="text-align: center; display: flex; flex-direction: column; gap: 10px;">
                <a href="vendors.html" class="secondaryButton" style="text-align: center;">Sign In as Student</a>
                <a href="admin-dashboard.html" class="secondaryButton" style="text-align: center;">Sign In as Administrator</a>
            </div>

            <div style="margin-top: 20px; padding: 12px; border: 1px solid var(--lightGrey); border-radius: 4px; background: #f9f9f9; font-size: 0.85rem; color: var(--grey);">
                <p style="font-weight: 600; margin-bottom: 4px;">Demo Logins:</p>
                <p>• Type <strong>student</strong> &rarr; Student Vendor Portal</p>
                <p>• Type <strong>vendor</strong> &rarr; Vendor Dashboard</p>
                <p>• Type <strong>admin</strong> &rarr; Administrator Dashboard</p>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Reset active cart when returning to login page
            if (typeof localStorage !== 'undefined') {
                localStorage.removeItem('campusFoodLinkCart');
            }

            // Populate Vendor Select Dropdown dynamically from storage.js
            const vendorSelect = document.getElementById('vendorSelectDropdown');
            const vendors = getAllVendors().filter(v => v.isActive !== false);

            if (vendorSelect && vendors.length > 0) {
                vendorSelect.innerHTML = vendors.map(v => 
                    `<option value="${v.id}">${v.name} (${v.location})</option>`
                ).join('');
            }

            // Vendor Login Button Handler
            const vendorLoginBtn = document.getElementById('vendorLoginBtn');
            if (vendorLoginBtn) {
                vendorLoginBtn.addEventListener('click', function() {
                    const selectedId = Number(vendorSelect.value);
                    const selectedVendor = vendors.find(v => Number(v.id) === selectedId);
                    if (selectedVendor) {
                        setActiveVendorSession(selectedVendor);
                        window.location.href = 'vendor-dashboard.html';
                    }
                });
            }

            // Form Submit Logic
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const username = document.getElementById('username').value.trim().toLowerCase();

                    if (username === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else if (username === 'vendor') {
                        // Log in using selected dropdown vendor
                        const selectedId = Number(vendorSelect.value);
                        const selectedVendor = vendors.find(v => Number(v.id) === selectedId) || vendors[0];
                        setActiveVendorSession(selectedVendor);
                        window.location.href = 'vendor-dashboard.html';
                    } else {
                        window.location.href = 'vendors.html';
                    }
                });
            }
        });
    </script>
</body>

</html>
