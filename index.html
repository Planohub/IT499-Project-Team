<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFoodLink+</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="roleLandingPage">
        <section class="roleLandingCard">
            <img src="CFL-Logo.png" alt="CampusFoodLink+ Logo" class="roleLandingLogo">

            <p class="loginSubtitle">Smart Campus Dining Platform</p>

            <div class="roleLandingIntro">
                <h2>Choose Your Login</h2>
                <p>Select your role to continue.</p>
            </div>

            <div class="roleButtonGroup">
                <a href="login.html?role=student" class="defaultButton roleLoginButton">
                    Student Login
                </a>
                <a href="login.html?role=vendor" class="defaultButton roleLoginButton">
                    Vendor Login
                </a>
                <a href="login.html?role=admin" class="defaultButton roleLoginButton">
                    Administrator Login
                </a>
            </div>
        </section>
    </main>

    <footer class="siteFooter">
        <span>2026 CampusFoodLink+. All rights reserved. | Version 1.0.5</span>
    </footer>
</body>

</html>
