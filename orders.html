<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFoodLink+ — My Orders</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navigationBar">
        <div class="navigationContainer">
            <div class="navigationBrand">
                <a href="index.html" style="display: flex; align-items: center; gap: 10px;">
                    <img src="CFL+Logo.png" alt="CampusFoodLink+ Logo" style="height: 32px; width: auto;">
                    <span>CampusFoodLink+</span>
                </a>
            </div>
            <div class="navigationLinks">
                <a href="student-dashboard.html">Vendors</a>
                <a href="checkout.html" id="cartLink">Cart (0)</a>
                <a href="orders.html" class="active">My Orders</a>
                <a href="index.html">Logout</a>
            </div>
            <div class="navigationUser">
                <span class="userBadge" id="studentHeaderBadge">🎓 Student</span>
            </div>
        </div>
    </nav>

    <div class="vendorSelectionContainer">
        <div class="pageHeader">
            <h2>My Order History</h2>
            <p>View all your past orders and their current status</p>
        </div>

        <div id="ordersContainer" style="margin-top: 20px;">
            <!-- Orders will be rendered by JavaScript -->
            <p style="text-align:center; padding:40px; color:var(--grey);">Loading orders...</p>
        </div>
    </div>

    <footer>
        <span class="balanceBadge">
            Meal-Plan Balance:&nbsp;<span id="mealPlanBalance">$250.00</span>
        </span>
    </footer>

    <script src="storage.js"></script>
    <script src="orders.js"></script>

    <footer style="background-color:#f1f1f1; 
                   text-align:center; 
                   padding:10px; 
                   font-size:14px; 
                   color:#555; 
                   border-top:1px solid #ccc;">
        &copy; 2026 CampusFoodLink+. All rights reserved. | Version 0.7.4
    </footer>
</body>

</html>
