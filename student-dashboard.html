<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFoodLink+ — Student Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navigationBar">
        <div class="navigationContainer">
            <div class="navigationBrand">
                <a href="index.html" style="display: flex; align-items: center; gap: 10px;">
                    <img src="CFL-Logo.png" alt="CampusFoodLink+ Logo" style="height: 32px; width: auto;">
                    <span>CampusFoodLink+</span>
                </a>
            </div>
            <div class="navigationLinks">
                <a href="student-dashboard.html" class="active">Vendors</a>
                <a id="cartLink" href="checkout.html">Cart (0)</a>
                <a href="orders.html">Orders</a>
                <a href="index.html">Logout</a>
            </div>
            <div class="navigationUser">
                <span class="userBadge" id="studentHeaderBadge">🎓 Student</span>
            </div>
        </div>
    </nav>

    <main class="vendorSelectionContainer">
        <div class="pageHeader">
            <h2>Select a Vendor</h2>
            <p>Choose a vendor to browse their menu</p>
        </div>

        <!-- Vendor Grid - Dynamically populated by JavaScript -->
        <div class="vendorGrid" id="vendorGrid">
            <!-- Vendors will be rendered here -->
        </div>
    </main>

    <span class="balanceBadge">
        Meal-Plan Balance:&nbsp;<span id="mealPlanBalance">$250.00</span>
    </span>

    <footer class="siteFooter">
        <span>🍔 &copy; 2026 CampusFoodLink+. All rights reserved. | Version 1.0.4</span>
    </footer>

    <script src="storage.js"></script>
    <script src="student-dashboard.js"></script>

</body>

</html>
