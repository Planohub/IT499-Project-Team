<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFoodLink+ — Login</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="loginBox">
        <header class="loginHeader">
            <a href="index.html" aria-label="Return to role selection">
                <img
                    src="CFL-Logo.png"
                    alt="CampusFoodLink+ Logo"
                    class="loginLogo"
                >
            </a>

            <h1>CampusFoodLink+</h1>
            <p class="loginSubtitle">Smart Campus Dining Platform</p>
        </header>

        <section class="loginCredentials">
            <div class="loginRoleIcon" id="loginRoleIcon">🔐</div>
            <h2 id="loginRoleTitle">Simulated Login</h2>
            <p class="loginRoleDescription" id="loginRoleDescription">
                Select an account to continue.
            </p>

            <!-- Student login -->
            <div class="roleLoginSection" id="studentLoginSection" hidden>
                <label for="studentSelectDropdown">Student account</label>

                <select id="studentSelectDropdown">
                    <option value="">Loading students...</option>
                </select>

                <button id="studentLoginBtn" class="defaultButton" type="button">
                    Continue as Student
                </button>
            </div>

            <!-- Vendor login -->
            <div class="roleLoginSection" id="vendorLoginSection" hidden>
                <label for="vendorSelectDropdown">Vendor account</label>

                <select id="vendorSelectDropdown">
                    <option value="">Loading vendors...</option>
                </select>

                <button id="vendorLoginBtn" class="defaultButton" type="button">
                    Continue as Vendor
                </button>
            </div>

            <!-- Administrator login -->
            <div class="roleLoginSection" id="adminLoginSection" hidden>
                <label for="adminSelectDropdown">Administrator account</label>

                <select id="adminSelectDropdown">
                    <option value="">Loading administrators...</option>
                </select>

                <button id="adminLoginBtn" class="defaultButton" type="button">
                    Continue as Administrator
                </button>
            </div>

            <p class="simulatedLoginNotice">
                This prototype uses simulated accounts and does not require a
                password.
            </p>

            <a href="index.html" class="backToRoleSelection">
                ← Choose a different role
            </a>
        </section>
    </main>

    <footer class="siteFooter">
        <span>
            🍔 &copy; 2026 CampusFoodLink+. All rights reserved. |
            Version 0.7.6
        </span>
    </footer>

    <script src="storage.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const params = new URLSearchParams(window.location.search);
            const requestedRole = params.get('role');

            const roleConfig = {
                student: {
                    title: 'Student Login',
                    description: 'Select a student account to browse vendors and place orders.',
                    icon: '🎓',
                    sectionId: 'studentLoginSection'
                },
                vendor: {
                    title: 'Vendor Login',
                    description: 'Select a vendor account to manage menus and orders.',
                    icon: '🏪',
                    sectionId: 'vendorLoginSection'
                },
                admin: {
                    title: 'Administrator Login',
                    description: 'Select an administrator account to manage campus dining operations.',
                    icon: '👔',
                    sectionId: 'adminLoginSection'
                }
            };

            const role = roleConfig[requestedRole]
                ? requestedRole
                : 'student';

            const currentRole = roleConfig[role];

            document.getElementById('loginRoleTitle').textContent =
                currentRole.title;

            document.getElementById('loginRoleDescription').textContent =
                currentRole.description;

            document.getElementById('loginRoleIcon').textContent =
                currentRole.icon;

            document.getElementById(currentRole.sectionId).hidden = false;

            // -------------------------------------------------
            // Student accounts
            // -------------------------------------------------
            const studentSelect =
                document.getElementById('studentSelectDropdown');

            const studentLoginBtn =
                document.getElementById('studentLoginBtn');

            const students = getStudents();

            if (students.length > 0) {
                studentSelect.innerHTML = students.map(student => {
                    const balance = getStudentBalance(student.userID);

                    return `
                        <option value="${student.userID}">
                            ${student.firstName} ${student.lastName}
                            — $${balance.toFixed(2)}
                        </option>
                    `;
                }).join('');
            } else {
                studentSelect.innerHTML =
                    '<option value="">No students available</option>';
            }

            studentLoginBtn.addEventListener('click', function () {
                const selectedId = Number(studentSelect.value);

                const selectedStudent = students.find(student =>
                    Number(student.userID) === selectedId
                );

                if (!selectedStudent) {
                    alert('Please select a valid student.');
                    return;
                }

                setActiveStudentSession(selectedStudent);
                window.location.href = 'student-dashboard.html';
            });

            // -------------------------------------------------
            // Vendor accounts
            // -------------------------------------------------
            const vendorSelect =
                document.getElementById('vendorSelectDropdown');

            const vendorLoginBtn =
                document.getElementById('vendorLoginBtn');

            const vendors = getAllVendors();

            if (vendors.length > 0) {
                vendorSelect.innerHTML = vendors.map(vendor => `
                    <option value="${vendor.id}">
                        ${vendor.name}
                    </option>
                `).join('');
            } else {
                vendorSelect.innerHTML =
                    '<option value="">No vendors available</option>';
            }

            vendorLoginBtn.addEventListener('click', function () {
                const selectedId = Number(vendorSelect.value);

                const selectedVendor = vendors.find(vendor =>
                    Number(vendor.id) === selectedId
                );

                if (!selectedVendor) {
                    alert('Please select a valid vendor.');
                    return;
                }

                setActiveVendorSession(selectedVendor);
                window.location.href = 'vendor-dashboard.html';
            });

            // -------------------------------------------------
            // Administrator accounts
            // -------------------------------------------------
            const adminSelect =
                document.getElementById('adminSelectDropdown');

            const adminLoginBtn =
                document.getElementById('adminLoginBtn');

            const admins = getAdmins();

            if (admins.length > 0) {
                adminSelect.innerHTML = admins.map(admin => `
                    <option value="${admin.userID}">
                        ${admin.firstName} ${admin.lastName}
                    </option>
                `).join('');
            } else {
                adminSelect.innerHTML =
                    '<option value="">No administrators available</option>';
            }

            adminLoginBtn.addEventListener('click', function () {
                const selectedId = Number(adminSelect.value);

                const selectedAdmin = admins.find(admin =>
                    Number(admin.userID) === selectedId
                );

                if (!selectedAdmin) {
                    alert('Please select a valid administrator.');
                    return;
                }

                setActiveAdminSession(selectedAdmin);
                window.location.href = 'admin-dashboard.html';
            });

            // Enter submits whichever role is visible.
            const activeSelect = document.querySelector(
                '.roleLoginSection:not([hidden]) select'
            );

            const activeButton = document.querySelector(
                '.roleLoginSection:not([hidden]) button'
            );

            if (activeSelect && activeButton) {
                activeSelect.addEventListener('keydown', function (event) {
                    if (event.key === 'Enter') {
                        activeButton.click();
                    }
                });
            }
        });
    </script>
</body>

</html>
