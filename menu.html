<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFoodLink+ — Menu</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navigationBar">
        <div class="navigationContainer">
            <div class="navigationBrand"><a href="index.html">CampusFoodLink+</a></div>
            <div class="navigationLinks">
                <a href="vendors.html">Vendors</a>
                <a href="checkout.html">Cart (0)</a>
                <a href="#">Orders</a>
                <a href="index.html">Logout</a>
            </div>
            <div class="navigationUser">
                <span class="userBadge">Student</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="vendorSelectionContainer">
        <!-- Back Button & Vendor Name -->
        <div class="menuPageHeader">
            <a href="vendors.html" class="goBackLink">← Back to Vendors</a>
            <h2 id="vendor-name">Campus Grill</h2>
            <p id="vendorLocation" class="vendorLocation">Student Union, 1st Floor</p>
        </div>

        <!-- Menu Items Grid -->
        <div class="menuItemGrid">

            <!-- Item 1 -->
            <div class="menuItemWrapper">
                <span class="itemNameAbove">Classic Burger</span>
                <div class="menuItemBox" data-item="Classic Burger" data-price="10.25">
                    <div class="menuItemPicture">
                        <span class="menuItemPictureOverlay">Add</span>
                    </div>
                    <div class="menuItemPriceArea">
                        <span class="menuItemPrice">$10.25</span>
                    </div>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="menuItemWrapper">
                <span class="itemNameAbove">Chicken Wrap</span>
                <div class="menuItemBox" data-item="Chicken Wrap" data-price="7.50">
                    <div class="menuItemPicture">
                        <span class="menuItemPictureOverlay">Add</span>
                    </div>
                    <div class="menuItemPriceArea">
                        <span class="menuItemPrice">$7.50</span>
                    </div>
                </div>
            </div>

            <!-- Item 3 -->
            <div class="menuItemWrapper">
                <span class="itemNameAbove">Onion Rings</span>
                <div class="menuItemBox" data-item="Onion Rings" data-price="5.50">
                    <div class="menuItemPicture">
                        <span class="menuItemPictureOverlay">Add</span>
                    </div>
                    <div class="menuItemPriceArea">
                        <span class="menuItemPrice">$5.50</span>
                    </div>
                </div>
            </div>

            <!-- Item 4 -->
            <div class="menuItemWrapper">
                <span class="itemNameAbove">Milkshake</span>
                <div class="menuItemBox" data-item="Milkshake" data-price="4.75">
                    <div class="menuItemPicture">
                        <span class="menuItemPictureOverlay">Add</span>
                    </div>
                    <div class="menuItemPriceArea">
                        <span class="menuItemPrice">$4.75</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <!-- View Cart Button -->
     <div class="menuActions">
        <a href="checkout.html" class="defaultButton">View Cart</a>
     </div>
    <footer>
        <span class="balanceBadge">Meal-Plan Balance:&nbsp;$250.00</span>
    </footer>
    <script src="script.js"></script>
</body>

</html>
