<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFoodLink+ — Menu</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navigationBar">
        <div class="navigationContainer">
            <div class="navigationBrand">
                <a href="index.html" style="display: flex; align-items: center; gap: 10px;">
                    <img src="CFL+Logo.png" alt="CampusFoodLink+ Logo" style="height: 32px; width: auto;">
                    <span>CampusFoodLink+</span>
                </a>
            </div>
            <div class="navigationLinks">
                <a href="student-dashboard.html">Vendors</a>
                <a href="checkout.html" id="cartLink">Cart (0)</a>
                <a href="orders.html">Orders</a>
                <a href="index.html">Logout</a>
            </div>
            <div class="navigationUser">
                <span class="userBadge" id="studentHeaderBadge">🎓 Student</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="vendorSelectionContainer">
        <!-- Back Button & Vendor Name -->
        <div class="menuPageHeader">
            <a href="student-dashboard.html" class="goBackLink">← Back to Vendors</a>
            <h2 id="vendor-name">Loading...</h2>
            <p id="vendorLocation" class="vendorLocation">Loading vendor location...</p>
        </div>

        <!-- Menu Items Grid -->
        <div class="menuItemGrid" id="menuItemGrid">
            <!-- Items will be dynamically rendered by JavaScript -->
            <div style="text-align:center; padding:40px; grid-column: 1 / -1; color: var(--grey);">
                Loading menu items...
            </div>
        </div>
    </div>

    <!-- View Cart Button -->
    <div class="menuActions">
        <a href="checkout.html" class="defaultButton">View Cart</a>
    </div>

    <footer>
        <span class="balanceBadge">
            Meal-Plan Balance:&nbsp;<span id="mealPlanBalance">$250.00</span>
        </span>
    </footer>

    <script src="storage.js"></script>
    <script src="menu.js"></script>

    <footer style="background-color:#f1f1f1; 
                   text-align:center; 
                   padding:10px; 
                   font-size:14px; 
                   color:#555; 
                   border-top:1px solid #ccc;">
        &copy; 2026 CampusFoodLink+. All rights reserved. | Version 0.7.4
    </footer>
</body>

</html>
