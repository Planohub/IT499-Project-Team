<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFoodLink+ — Menu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navigationBar">
        <div class="navigationContainer">
            <div class="navigationBrand">CampusFoodLink+</div>
            <div class="navigationLinks">
                <a href="vendors.html">Vendors</a>
                <a href="checkout.html">Cart (0)</a>
                <a href="#">Orders</a>
                <a href="index.html">Logout</a>
            </div>
            <div class="navigationUser">
                <span class="userBadge">Student</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="vendorSelectionContainer">
        <!-- Back Button & Vendor Name -->
        <div class="menu-header">
            <a href="vendors.html" class="back-link">← Back to Vendors</a>
            <h2 id="vendor-name">Campus Grill</h2>
            <p id="vendor-location" class="vendor-location">Student Union, 1st Floor</p>
        </div>

        <!-- Menu Items Grid -->
        <div class="menu-grid">

            <!-- Item 1 -->
            <div class="menu-item-wrapper">
                <span class="item-name-above">Classic Burger</span>
                <div class="menu-item-card" data-item="Classic Burger" data-price="10.25">
                    <div class="menu-item-image">
                        <span class="add-overlay">Add</span>
                    </div>
                    <div class="menu-item-info">
                        <span class="menu-itemPrice">$10.25</span>
                    </div>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="menu-item-wrapper">
                <span class="item-name-above">Chicken Wrap</span>
                <div class="menu-item-card" data-item="Chicken Wrap" data-price="7.50">
                    <div class="menu-item-image">
                        <span class="add-overlay">Add</span>
                    </div>
                    <div class="menu-item-info">
                        <span class="menu-itemPrice">$7.50</span>
                    </div>
                </div>
            </div>

            <!-- Item 3 -->
            <div class="menu-item-wrapper">
                <span class="item-name-above">Onion Rings</span>
                <div class="menu-item-card" data-item="Onion Rings" data-price="5.50">
                    <div class="menu-item-image">
                        <span class="add-overlay">Add</span>
                    </div>
                    <div class="menu-item-info">
                        <span class="menu-itemPrice">$5.50</span>
                    </div>
                </div>
            </div>

            <!-- Item 4 -->
            <div class="menu-item-wrapper">
                <span class="item-name-above">Milkshake</span>
                <div class="menu-item-card" data-item="Milkshake" data-price="4.75">
                    <div class="menu-item-image">
                        <span class="add-overlay">Add</span>
                    </div>
                    <div class="menu-item-info">
                        <span class="menu-itemPrice">$4.75</span>
                    </div>
                </div>
            </div>
    <script src="script.js"></script>
</body>
<footer>
    <span class="balanceBadge">$250.00</span>
</footer>
</html>
