<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFoodLink+ — Order Confirmation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navigationBar">
        <div class="navigationContainer">
            <div class="navigationBrand">CampusFoodLink+</div>
            <div class="navigationLinks">
                <a href="vendors.html">Vendors</a>
                <a href="#">Cart (0)</a>
                <a href="confirmation.html" class="active">Orders</a>
                <a href="index.html">Logout</a>
            </div>
            <div class="navigationUser">
                <span class="userBadge">Student</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="vendorSelectionContainer">
        <div class="confirmationBox">
            <div class="confirmationIcon">✅</div>
            <h2>Order Placed!</h2>
            <p class="confirmationMessage">Your order has been received and is being prepared.</p>

            <div class="orderDetailsBox">
                <div class="orderDetailRow">
                    <span class="orderDetailLabel">Order #</span>
                    <span class="detailsOfOrder">#1001</span>
                </div>
                <div class="orderDetailRow">
                    <span class="orderDetailLabel">Vendor</span>
                    <span class="detailsOfOrder">Campus Grill</span>
                </div>
                <div class="orderDetailRow">
                    <span class="orderDetailLabel">Total</span>
                    <span class="detailsOfOrder">$18.47</span>
                </div>
                <div class="orderDetailRow">
                    <span class="orderDetailLabel">Status</span>
                    <span class="detailsOfOrder status-confirmed">Confirmed</span>
                </div>
            </div>

            <p class="orderNote">You will receive an update when your order is ready.</p>

            <div class="confirmationButtons">
                <a href="vendors.html" class="secondaryButton">← Continue Shopping</a>
                <a href="vendors.html" class="defaultButton">Order Another</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
<footer>
    <span class="balanceBadge">$250.00</span>
</footer>
</html>
