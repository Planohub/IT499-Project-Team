<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFoodLink+ — Checkout</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navigationBar">
        <div class="navigationContainer">
            <div class="navigationBrand">
            <a href="index.html" style="display: flex; align-items: center; gap: 10px;">
            <img src="CFL+Logo.png" alt="CampusFoodLink+ Logo" style="height: 32px; width: auto;">
            <span>CampusFoodLink+</span>
            </a>
        </div>
            <div class="navigationLinks">
                <a href="student-dashboard.html">Vendors</a>
                <a href="checkout.html" class="active" id="cartLink">Cart (0)</a>
                <a href="orders.html">Orders</a>
                <a href="index.html">Logout</a>
            </div>
            <div class="navigationUser">
                <span class="userBadge">Student</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="vendorSelectionContainer">
        <div class="pageHeader">
            <h2>Checkout</h2>
            <p>Review your order before placing it</p>
        </div>

        <!-- Cart Items -->
        <div class="checkoutItems" id="checkoutItems"></div>

        <!-- Order Summary -->
        <div class="orderSummary">
            <div class="summaryRow">
                <span>Subtotal</span>
                <span id="subtotal">$0.00</span>
            </div>
            <div class="summaryRow">
                <span>Tax</span>
                <span id="tax">$0.00</span>
            </div>
            <div class="summaryRow total">
                <span>Total</span>
                <span id="total">$0.00</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="checkoutOptions">
            <a href="student-dashboard.html" class="secondaryButton">&larr; Continue Shopping</a>
            <button id="clearCartButton" class="secondaryButton">❌ Clear Cart</button>
            <button id="placeOrderButton" class="defaultButton">Place Order</button>
        </div>
    </div>
    <footer>
        <span class="balanceBadge">
            Meal-Plan Balance:&nbsp;<span id="mealPlanBalance">$250.00</span>
        </span>
    </footer>
    <script src="storage.js"></script>
    <script src="checkout.js"></script>
</body>

</html>
