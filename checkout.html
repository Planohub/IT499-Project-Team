<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFoodLink+ — Checkout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navigationBar">
        <div class="navigationContainer">
            <div class="navigationBrand">CampusFoodLink+</div>
            <div class="navigationLinks">
                <a href="vendors.html">Vendors</a>
                <a href="checkout.html" class="active">Cart (3)</a>
                <a href="#">Orders</a>
                <a href="index.html">Logout</a>
            </div>
            <div class="navigationUser">
                <span class="userBadge">Student</span>
                <span class="balanceBadge">$250.00</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="vendorSelectionContainer">
        <div class="pageHeader">
            <h2>Checkout</h2>
            <p>Review your order before placing it</p>
        </div>

        <!-- Cart Items -->
        <div class="checkoutItems">
            <div class="checkoutItem">
                <div class="itemSummary">
                    <span class="itemName">Classic Burger</span>
                    <span class="itemQty">×1</span>
                </div>
                <span class="itemPrice">$8.99</span>
            </div>

            <div class="checkoutItem">
                <div class="itemSummary">
                    <span class="itemName">Onion Rings</span>
                    <span class="itemQty">×1</span>
                </div>
                <span class="itemPrice">$3.99</span>
            </div>

            <div class="checkoutItem">
                <div class="itemSummary">
                    <span class="itemName">Milkshake</span>
                    <span class="itemQty">×1</span>
                </div>
                <span class="itemPrice">$5.49</span>
            </div>
        </div>

        <!-- Order Summary -->
        <div class="orderSummary">
            <div class="summaryRow">
                <span>Subtotal</span>
                <span>$18.47</span>
            </div>
            <div class="summaryRow">
                <span>Tax</span>
                <span>$0.00</span>
            </div>
            <div class="summaryRow total">
                <span>Total</span>
                <span>$18.47</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="checkoutOptions">
            <a href="vendors.html" class="secondaryButton">← Continue Shopping</a>
            <a href="confirmation.html" class="defaultButton">Place Order</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
