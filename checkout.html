<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFoodLink+ — Checkout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navigationBar">
        <div class="navigationContainer">
            <div class="navigationBrand"><a href="index.html">CampusFoodLink+</a></div>
            <div class="navigationLinks">
                <a href="vendors.html">Vendors</a>
                <a href="checkout.html" class="active" id="cartLink">Cart (0)</a>
                <a href="#">Orders</a>
                <a href="index.html">Logout</a>
            </div>
            <div class="navigationUser">
                <span class="userBadge">Student</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="vendorSelectionContainer">
        <div class="pageHeader">
            <h2>Checkout</h2>
            <p>Review your order before placing it</p>
        </div>

        <!-- Cart Items -->
        <div class="checkoutItems" id="checkoutItems"></div>

        <!-- Order Summary -->
        <div class="orderSummary">
            <div class="summaryRow">
                <span>Subtotal</span>
                <span id="subtotal">$0.00</span>
            </div>
            <div class="summaryRow">
                <span>Tax</span>
                <span id="tax">$0.00</span>
            </div>
            <div class="summaryRow total">
                <span>Total</span>
                <span id="total">$0.00</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="checkoutOptions">
            <a href="vendors.html" class="secondaryButton">← Continue Shopping</a>
            <a href="confirmation.html" class="defaultButton">Place Order</a>
        </div>
    </div>
    <footer>
        <span class="balanceBadge">Meal-Plan Balance:&nbsp;$250.00</span>
    </footer>
    <script src="storage.js"></script>
    <script src="checkout.js"></script>
</body>

</html>
