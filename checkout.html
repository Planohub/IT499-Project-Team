<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFoodLink+ — Checkout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">CampusFoodLink+</div>
            <div class="nav-links">
                <a href="vendors.html">Vendors</a>
                <a href="checkout.html" class="active">Cart (3)</a>
                <a href="#">Orders</a>
                <a href="index.html">Logout</a>
            </div>
            <div class="nav-user">
                <span class="user-badge">Student</span>
                <span class="balance-badge">$250.00</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <div class="page-header">
            <h2>Checkout</h2>
            <p>Review your order before placing it</p>
        </div>

        <!-- Cart Items -->
        <div class="checkout-items">
            <div class="checkout-item">
                <div class="item-details">
                    <span class="item-name">Classic Burger</span>
                    <span class="item-qty">×1</span>
                </div>
                <span class="item-price">$8.99</span>
            </div>

            <div class="checkout-item">
                <div class="item-details">
                    <span class="item-name">Onion Rings</span>
                    <span class="item-qty">×1</span>
                </div>
                <span class="item-price">$3.99</span>
            </div>

            <div class="checkout-item">
                <div class="item-details">
                    <span class="item-name">Milkshake</span>
                    <span class="item-qty">×1</span>
                </div>
                <span class="item-price">$5.49</span>
            </div>
        </div>

        <!-- Order Summary -->
        <div class="order-summary">
            <div class="summary-row">
                <span>Subtotal</span>
                <span>$18.47</span>
            </div>
            <div class="summary-row">
                <span>Tax</span>
                <span>$0.00</span>
            </div>
            <div class="summary-row total">
                <span>Total</span>
                <span>$18.47</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="checkout-actions">
            <a href="vendors.html" class="btn-secondary">← Continue Shopping</a>
            <a href="confirmation.html" class="btn-primary">Place Order</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
