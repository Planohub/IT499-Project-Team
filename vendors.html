<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFoodLink+ — Vendors</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
        }

        .navbar {
            border-bottom: 2px solid #cccccc;
            padding: 15px 30px;
            background: #ffffff;
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-brand {
            font-size: 1.3rem;
            font-weight: 700;
            color: #000000;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: #000000;
            font-weight: 500;
            text-decoration: none;
            padding: 5px 0;
            border-bottom: 2px solid transparent;
        }

        .nav-links a:hover {
            border-bottom-color: #000000;
        }

        .nav-links a.active {
            border-bottom-color: #000000;
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.9rem;
        }

        .user-badge {
            border: 1px solid #cccccc;
            padding: 4px 14px;
            border-radius: 4px;
            font-weight: 500;
        }

        .balance-badge {
            border: 1px solid #cccccc;
            padding: 4px 14px;
            border-radius: 4px;
            font-weight: 600;
        }

        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h2 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .page-header p {
            color: #555555;
            margin-top: 5px;
        }

        .vendor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .vendor-card {
            border: 2px solid #cccccc;
            border-radius: 8px;
            padding: 30px 20px;
            background: #ffffff;
            transition: border-color 0.2s;
            text-decoration: none;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
        }

        .vendor-card:hover {
            border-color: #666666;
        }

        .vendor-card h4 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .view-menu-btn {
            display: inline-block;
            padding: 8px 24px;
            border: 2px solid #000000;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #000000;
            background: #ffffff;
            cursor: pointer;
            text-decoration: none;
        }

        .view-menu-btn:hover {
            background: #000000;
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-wrap: wrap;
                gap: 10px;
            }
            .nav-links {
                order: 3;
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
                gap: 15px;
            }
            .vendor-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .page-header h2 {
                font-size: 1.4rem;
            }
            .nav-user {
                font-size: 0.8rem;
            }
            .user-badge,
            .balance-badge {
                padding: 2px 10px;
            }
            .vendor-grid {
                grid-template-columns: 1fr 1fr;
            }
            .vendor-card {
                min-height: 140px;
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">CampusFoodLink+</div>
            <div class="nav-links">
                <a href="vendors.html" class="active">Vendors</a>
                <a href="#">Cart (0)</a>
                <a href="#">Orders</a>
                <a href="index.html">Logout</a>
            </div>
            <div class="nav-user">
                <span class="user-badge">Student</span>
                <span class="balance-badge">$250.00</span>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="page-header">
            <h2>Select a Vendor</h2>
            <p>Choose a vendor to browse their menu</p>
        </div>

        <div class="vendor-grid">
            <a href="#" class="vendor-card">
                <h4>Vendor 1</h4>
                <span class="view-menu-btn">View Menu →</span>
            </a>

            <a href="#" class="vendor-card">
                <h4>Vendor 2</h4>
                <span class="view-menu-btn">View Menu →</span>
            </a>

            <a href="#" class="vendor-card">
                <h4>Vendor 3</h4>
                <span class="view-menu-btn">View Menu →</span>
            </a>

            <a href="#" class="vendor-card">
                <h4>Vendor 4</h4>
                <span class="view-menu-btn">View Menu →</span>
            </a>

            <a href="#" class="vendor-card">
                <h4>Vendor 5</h4>
                <span class="view-menu-btn">View Menu →</span>
            </a>
        </div>
    </div>
</body>
</html>
