<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFoodLink+ — Vendor Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navigationBar">
        <div class="navigationContainer">
            <div class="navigationBrand">
            <a href="index.html" style="display: flex; align-items: center; gap: 10px;">
            <img src="CFL+Logo.png" alt="CampusFoodLink+ Logo" style="height: 32px; width: auto;">
            <span>CampusFoodLink+</span>
            </a>
        </div>
            <div class="navigationLinks">
                <a href="vendor-dashboard.html" class="active">Vendor Dashboard</a>
                <a href="index.html">Logout</a>
            </div>
            <div class="navigationUser">
                <span class="userBadge" id="vendorHeaderBadge">🏬 Vendor Dashboard</span>
            </div>
        </div>
    </nav>

    <div class="pageHeader">
        <h2>Vendor Dashboard</h2>
        <p>Workflow: Process an Order &amp; Vendor Menu Management</p>
        <div id="vendorStatusBanner" style="margin-top: 10px; padding: 10px; border-radius: 4px; display: none;"></div>
    </div>

        <div style="display: flex; gap: 15px; margin-bottom: 25px;">
            <button id="tabOrdersBtn" class="defaultButton" style="width: auto; padding: 10px 25px;">Incoming Orders</button>
            <button id="tabMenuBtn" class="secondaryButton" style="width: auto; padding: 10px 25px;">Menu Management</button>
        </div>

        <div id="ordersSection">
            <div class="orderDetailsBox">
                <h3>Active Orders Queue</h3>
                <p style="color: var(--grey); font-size: 0.9rem; margin-top: 4px;">Advance order statuses sequentially: Pending → Accepted → Preparing → Ready → Complete</p>
                <div id="vendorOrdersContainer" style="margin-top: 15px;">
                    </div>
            </div>
        </div>

        <div id="menuSection" style="display: none;">
            <div class="orderDetailsBox" style="margin-bottom: 25px;">
                <h3>Add New Menu Item</h3>
                <form id="addMenuItemForm" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px;">
                    <div class="credentialForm">
                        <label for="newItemName">Item Name</label>
                        <input type="text" id="newItemName" placeholder="e.g., Bacon Cheeseburger" required>
                    </div>
                    <div class="credentialForm">
                        <label for="newItemPrice">Price ($)</label>
                        <input type="number" step="0.01" id="newItemPrice" placeholder="e.g., 9.50" required>
                    </div>
                    <div class="credentialForm" style="grid-column: 1 / -1;">
                        <label for="newItemDesc">Description</label>
                        <input type="text" id="newItemDesc" placeholder="e.g., Served with fresh lettuce and house sauce">
                    </div>
                    <div style="grid-column: 1 / -1;">
                        <button type="submit" class="defaultButton" style="width: auto; padding: 10px 30px;">Add Menu Item</button>
                    </div>
                </form>
            </div>

            <div class="orderDetailsBox">
                <h3>Current Vendor Menu Catalog</h3>
                <div id="vendorMenuContainer" style="margin-top: 15px; overflow-x: auto;">
                    </div>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="vendor-dashboard.js"></script>
</body>

</html>
